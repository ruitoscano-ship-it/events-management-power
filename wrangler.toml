# Static Vite app → Cloudflare Pages
# Preferred Git settings: build = npm run build, output = dist, deploy command = (empty)
# If the dashboard still runs `npx wrangler deploy`, [assets] below makes that succeed after build.
name = "events-management-power"
pages_build_output_dir = "dist"
compatibility_date = "2025-05-21"

[assets]
directory = "./dist"
